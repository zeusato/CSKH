openapi: 3.1.0
info:
  title: SHS Chat Gateway API
  version: 0.2.0
  summary: REST API của Chat Gateway cho các nền tảng tích hợp (app khách, trang nhân viên).
  description: |
    Nguồn: repo `zeusato/Chat-server`, commit `ce1d50b` (23/10/2026). Hướng dẫn từng bước, WebSocket và code mẫu ở
    `docs/integration-guide.md`. Khi file này lệch với code, `tests/contract/openapi.test.ts` sẽ fail.

    - Xác thực: backend nền tảng ký assertion Ed25519 → `POST /sessions` → Bearer access token 5 phút.
    - API quản trị `/admin/*` dùng admin key riêng, chỉ gọi server-to-server.
    - Mọi thời gian là UTC ISO-8601. ID và STK là string.
    - Gateway có thể thêm field mới vào response; client phải bỏ qua field lạ.
    - Request có header `Origin` phải nằm trong allowlist của Gateway, nếu không trả 403.
    - Tin nhắn là plain text. Client hiển thị bằng text node và tự nhận diện link http/https, không render HTML.
servers:
  - url: https://chat-server-poc.vercel.app/v1/chat
    description: PoC (dữ liệu tổng hợp, gói Hobby, có cold start)
  - url: http://127.0.0.1:8080/v1/chat
    description: Local (`npm run dev:local`)
tags:
  - name: session
  - name: conversation
  - name: message
  - name: queue
  - name: realtime
  - name: admin
security:
  - chatSession: []
paths:
  /health:
    get:
      tags: [session]
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, const: true } }, required: [ok] }
  /sessions:
    post:
      tags: [session]
      summary: Mở phiên chat bằng assertion của nền tảng
      description: Assertion chỉ dùng một lần, sống ≤60 giây. Không có endpoint refresh; gần hết hạn thì xin assertion mới và gọi lại.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [proof], properties: { proof: { type: string, description: JWT EdDSA do backend nền tảng ký } } }
      responses:
        '201':
          description: Phiên đã mở
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionGrant' } } }
        '401': { $ref: '#/components/responses/Error', description: 'Assertion sai, hết hạn hoặc đã dùng' }
        '403': { $ref: '#/components/responses/Error', description: 'Nhân viên chưa đăng ký / bị hủy đăng ký, hoặc principal bị vô hiệu' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error', description: 'Engine chưa sẵn sàng; assertion chưa bị tiêu, thử lại khi còn hạn' }
  /sessions/current:
    delete:
      tags: [session]
      summary: Đăng xuất (thu hồi phiên và đóng socket)
      responses:
        '204': { description: Đã thu hồi }
        '401': { $ref: '#/components/responses/Error' }
  /realtime-tickets:
    post:
      tags: [realtime]
      summary: Xin ticket WebSocket dùng một lần (30 giây)
      responses:
        '201':
          description: Ticket
          content:
            application/json:
              schema: { type: object, required: [ticket, expiresAt], properties: { ticket: { type: string }, expiresAt: { type: string, format: date-time } } }
        '401': { $ref: '#/components/responses/Error' }
  /events:
    get:
      tags: [realtime]
      summary: Replay event theo cursor (khôi phục khi mất kết nối)
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Cursor opaque lấy từ event/frame trước }
      responses:
        '200':
          description: Trang event
          content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } }
        '401': { $ref: '#/components/responses/Error' }
  /conversations:
    get:
      tags: [conversation]
      summary: Hội thoại người gọi được đọc
      description: Khách nhận hội thoại của chính mình. Nhân viên nhận mọi hội thoại support trong queue của mình (dùng `/queues/{queueId}/conversations` để lọc).
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/ConversationKind' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ConversationStatus' } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Trang hội thoại
          content: { application/json: { schema: { $ref: '#/components/schemas/ConversationPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [conversation]
      summary: Khách tạo hội thoại
      description: Chỉ phiên customer. `accountRef` phải thuộc STK trong phiên. Gửi lại cùng `clientRequestId` trả lại hội thoại cũ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, accountRef, subject, clientRequestId]
              properties:
                kind: { $ref: '#/components/schemas/ConversationKind' }
                accountRef: { type: string, maxLength: 64 }
                subject: { type: string, minLength: 1, maxLength: 200 }
                clientRequestId: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201':
          description: Hội thoại (mới hoặc cũ theo clientRequestId)
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Không phải customer hoặc accountRef ngoài phiên }
        '409': { $ref: '#/components/responses/Error', description: 'IDEMPOTENCY_KEY_REUSED, ADVISOR_UNASSIGNED' }
        '422': { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    get:
      tags: [conversation]
      summary: Chi tiết hội thoại
      responses:
        '200':
          description: Hội thoại
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error', description: Không có hoặc ngoài quyền }
  /conversations/{conversationId}/messages:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    get:
      tags: [message]
      summary: Lịch sử tin (mới nhất trước, phân trang cursor)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Trang tin
          content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [message]
      summary: Gửi tin
      description: |
        Mỗi tin người dùng chủ động gửi có `clientMessageId` mới; retry dùng lại đúng id đó. `internal` chỉ cho nhân viên.
        201 = đã nhận và trả Message; 202 = đang xử lý hoặc kết quả chưa rõ, tra `GET /message-requests/{clientMessageId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientMessageId, text]
              properties:
                clientMessageId: { type: string, minLength: 1, maxLength: 64 }
                text: { type: string, minLength: 1, maxLength: 8000, description: 'Plain text, đếm theo code point; không được chỉ có khoảng trắng' }
                visibility: { $ref: '#/components/schemas/MessageVisibility' }
      responses:
        '201':
          description: Tin đã nhận
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '202':
          description: Receipt (processing/unknown)
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageReceipt' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Không có quyền trả lời/ghi chú }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: 'IDEMPOTENCY_KEY_REUSED, CONVERSATION_RESOLVED' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error', description: ENGINE_NOT_READY (hội thoại chưa khởi tạo xong) hoặc DEPENDENCY_FAILED }
  /message-requests/{clientMessageId}:
    get:
      tags: [message]
      summary: Tra trạng thái tin đã gửi
      parameters:
        - { name: clientMessageId, in: path, required: true, schema: { type: string } }
        - { name: conversationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Receipt
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageReceipt' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}/read:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    post:
      tags: [message]
      summary: Đánh dấu đã đọc tới một tin (đơn điệu, không lùi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [lastReadMessageId], properties: { lastReadMessageId: { type: string, format: uuid } } }
      responses:
        '200':
          description: Mốc đọc hiện tại (có thể mới hơn mốc gửi lên, do tab khác)
          content:
            application/json:
              schema: { type: object, required: [lastReadMessageId], properties: { lastReadMessageId: { type: string, format: uuid } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /queues/{queueId}/conversations:
    parameters: [{ $ref: '#/components/parameters/queueId' }]
    get:
      tags: [queue]
      summary: Pool hội thoại support của một queue (nhân viên)
      description: Các bộ lọc kết hợp AND. Cursor chỉ dùng với đúng bộ lọc đã tạo ra nó; dùng chéo trả 422.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ConversationStatus' } }
        - { name: owner, in: query, schema: { type: string, enum: [none, me, others] }, description: 'none: chưa ai nhận; me: tôi phụ trách; others: người khác phụ trách' }
        - { name: mine, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'true: tôi là owner hoặc người hỗ trợ' }
        - { name: accountRef, in: query, schema: { type: string, minLength: 1, maxLength: 64 }, description: Khớp đúng STK }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Trang hội thoại
          content: { application/json: { schema: { $ref: '#/components/schemas/ConversationPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error', description: Không thuộc queue }
        '422': { $ref: '#/components/responses/Error' }
  /queues/{queueId}/members:
    parameters: [{ $ref: '#/components/parameters/queueId' }]
    get:
      tags: [queue]
      summary: Đồng nghiệp nhận chuyển giao được
      description: Agent/supervisor active của queue, đã mở chat ít nhất một lần. Không gồm observer. Chỉ agent/supervisor gọi được.
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/QueueMember' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}/claim:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    post:
      tags: [queue]
      summary: Nhận xử lý hội thoại chưa có người nhận
      requestBody: { $ref: '#/components/requestBodies/Revision' }
      responses: &mutationResponses
        '200':
          description: Hội thoại sau thay đổi
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Thiếu quyền (xem capabilities) }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: 'REVISION_CONFLICT, ALREADY_CLAIMED, INVALID_TRANSITION' }
        '422': { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}/join:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    post:
      tags: [queue]
      summary: Tự tham gia hỗ trợ hội thoại đã có người phụ trách
      requestBody: { $ref: '#/components/requestBodies/Revision' }
      responses: *mutationResponses
  /conversations/{conversationId}/leave:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    post:
      tags: [queue]
      summary: Rời hỗ trợ
      requestBody: { $ref: '#/components/requestBodies/Revision' }
      responses: *mutationResponses
  /conversations/{conversationId}/release:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    post:
      tags: [queue]
      summary: Trả hội thoại về pool (owner hoặc supervisor)
      requestBody: { $ref: '#/components/requestBodies/RevisionReason' }
      responses: *mutationResponses
  /conversations/{conversationId}/transfer:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    post:
      tags: [queue]
      summary: Chuyển người phụ trách (owner hoặc supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPrincipalId, expectedRevision]
              properties:
                targetPrincipalId: { type: string, format: uuid, description: Lấy từ /queues/{queueId}/members }
                expectedRevision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses: *mutationResponses
  /conversations/{conversationId}/participants:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    post:
      tags: [queue]
      summary: Thêm người hỗ trợ cho người khác (owner hoặc supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId, role, expectedRevision]
              properties:
                principalId: { type: string, format: uuid }
                role: { $ref: '#/components/schemas/ParticipantRole' }
                expiresAt: { type: [string, 'null'], format: date-time, description: Bắt buộc với delegate (tư vấn) }
                expectedRevision: { type: integer }
      responses: *mutationResponses
  /conversations/{conversationId}/participants/{principalId}:
    parameters:
      - { $ref: '#/components/parameters/conversationId' }
      - { name: principalId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [queue]
      summary: Gỡ người hỗ trợ (owner hoặc supervisor)
      parameters:
        - { name: expectedRevision, in: query, required: true, schema: { type: integer } }
      responses: *mutationResponses
  /conversations/{conversationId}/status:
    parameters: [{ $ref: '#/components/parameters/conversationId' }]
    patch:
      tags: [queue]
      summary: Đổi trạng thái
      description: 'Chuyển hợp lệ: open → pending_customer | resolved; pending_customer → open | resolved; resolved → open. Nhân viên cần canResolve/canReopen. Khách chỉ được mở lại (canReopen).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedRevision]
              properties:
                status: { $ref: '#/components/schemas/ConversationStatus' }
                expectedRevision: { type: integer }
      responses: *mutationResponses
  /admin/staff:
    get:
      tags: [admin]
      summary: Sổ đăng ký nhân viên của tenant
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/StaffRegistration' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /admin/staff/{issuer}/{subject}:
    parameters:
      - { name: issuer, in: path, required: true, schema: { type: string }, description: URL-encode }
      - { name: subject, in: path, required: true, schema: { type: string }, description: '`sub` mà trang nhân viên ký; URL-encode' }
    put:
      tags: [admin]
      summary: Đăng ký / cập nhật / kích hoạt lại nhân viên
      description: Đổi quyền có hiệu lực ngay với phiên đang mở.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, queueIds]
              properties:
                displayName: { type: string, maxLength: 200 }
                roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StaffRole' } }
                queueIds:
                  type: array
                  description: agent/supervisor/observer cần ít nhất một queue
                  items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
      responses:
        '200':
          description: Đăng ký
          content: { application/json: { schema: { $ref: '#/components/schemas/StaffRegistration' } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      summary: Hủy đăng ký (thu hồi mọi phiên/socket, chặn đăng nhập mới)
      security: [{ adminKey: [] }]
      responses:
        '204': { description: Đã hủy }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    chatSession:
      type: http
      scheme: bearer
      description: accessToken từ POST /sessions. Chỉ giữ trong RAM.
    adminKey:
      type: http
      scheme: bearer
      description: Admin key của tenant. Chỉ server-to-server, không đưa vào app/web.
  parameters:
    conversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    queueId: { name: queueId, in: path, required: true, schema: { type: string } }
    cursor: { name: cursor, in: query, schema: { type: string }, description: Cursor opaque từ nextCursor }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
  requestBodies:
    Revision:
      required: true
      content:
        application/json:
          schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer } } }
    RevisionReason:
      required: true
      content:
        application/json:
          schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer }, reason: { type: string, maxLength: 500 } } }
  responses:
    Error:
      description: Lỗi chuẩn
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
  schemas:
    ConversationKind: { type: string, enum: [support, advisory] }
    ConversationStatus: { type: string, enum: [open, pending_customer, resolved] }
    MessageVisibility: { type: string, enum: [public, internal], default: public }
    ParticipantRole: { type: string, enum: [collaborator, delegate] }
    StaffRole: { type: string, enum: [agent, supervisor, observer, advisor, advisory_supervisor] }
    ErrorCode:
      type: string
      enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, REVISION_CONFLICT, ALREADY_CLAIMED, IDEMPOTENCY_KEY_REUSED, INVALID_TRANSITION, CONVERSATION_RESOLVED, ADVISOR_UNASSIGNED, VALIDATION_FAILED, PAYLOAD_TOO_LARGE, FEATURE_DISABLED, ENGINE_NOT_READY, DEPENDENCY_FAILED, INTERNAL]
    ErrorBody:
      type: object
      required: [code, message, correlationId, retryable]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: 'Mô tả cho dev, không hiển thị cho người dùng' }
        correlationId: { type: string }
        retryable: { type: boolean }
    SessionGrant:
      type: object
      required: [accessToken, expiresAt, principal, capabilities]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        principal:
          type: object
          required: [id, kind, displayName]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [customer, staff] }
            displayName: { type: string }
        capabilities:
          type: object
          required: [roles, queueIds, accountRefs]
          properties:
            roles: { type: array, items: { $ref: '#/components/schemas/StaffRole' } }
            queueIds: { type: array, items: { type: string } }
            accountRefs: { type: array, items: { type: string } }
    Capabilities:
      type: object
      required: [canReply, canClaim, canTransfer, canAddNote, canResolve, canRelease, canManageParticipants, canJoin, canLeave, canReopen]
      properties:
        canReply: { type: boolean }
        canClaim: { type: boolean }
        canTransfer: { type: boolean }
        canAddNote: { type: boolean }
        canResolve: { type: boolean }
        canRelease: { type: boolean }
        canManageParticipants: { type: boolean }
        canJoin: { type: boolean }
        canLeave: { type: boolean }
        canReopen: { type: boolean }
    PersonRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, description: 'Phía khách: ID chung 00000000-0000-0000-0000-000000000000 cho mọi nhân viên' }
        displayName: { type: string, description: 'Phía khách: luôn là tên chung (mặc định "CSKH SHS")' }
    Conversation:
      type: object
      required: [id, kind, accountRef, subject, status, owner, revision, unreadCount, updatedAt, syncState, needsReview, capabilities]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ConversationKind' }
        accountRef: { type: string }
        subject: { type: string }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        owner: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        revision: { type: integer }
        unreadCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
        syncState: { type: string, enum: [ready, pending, failed], description: 'pending: chưa gửi tin được' }
        needsReview: { type: boolean }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        customer: { $ref: '#/components/schemas/PersonRef', description: Chỉ trả cho nhân viên }
        participants:
          type: array
          description: Chỉ trả cho nhân viên; không gồm owner
          items:
            type: object
            required: [id, displayName, role, expiresAt]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string }
              role: { $ref: '#/components/schemas/ParticipantRole' }
              expiresAt: { type: [string, 'null'], format: date-time }
    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        nextCursor: { type: [string, 'null'] }
    Message:
      type: object
      required: [id, conversationId, clientMessageId, sender, visibility, text, createdAt, status, attachments]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        clientMessageId: { type: [string, 'null'] }
        sender:
          type: object
          required: [id, kind, displayName]
          properties:
            id: { type: string }
            kind: { type: string, enum: [customer, agent, system] }
            displayName: { type: string }
        visibility: { $ref: '#/components/schemas/MessageVisibility' }
        text: { type: string, description: Plain text; không render HTML }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [accepted, delivered, read] }
        attachments: { type: array, maxItems: 0, items: {}, description: Luôn rỗng (không hỗ trợ file) }
    MessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        nextCursor: { type: [string, 'null'] }
    MessageReceipt:
      type: object
      required: [clientMessageId, conversationId, status, messageId]
      properties:
        clientMessageId: { type: string }
        conversationId: { type: string, format: uuid }
        status: { type: string, enum: [processing, accepted, unknown, rejected] }
        messageId: { type: [string, 'null'] }
    ChatEvent:
      type: object
      required: [eventId, type, conversationId, occurredAt, revision, cursor, payload]
      properties:
        eventId: { type: string }
        type: { type: string, enum: [conversation.created, conversation.updated, conversation.assigned, message.created, conversation.read] }
        conversationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        revision: { type: [integer, 'null'] }
        cursor: { type: string }
        payload: { type: object, description: 'Chỉ metadata, không có nội dung tin. Sau event, gọi lại HTTP để lấy dữ liệu' }
    EventPage:
      type: object
      required: [events, nextCursor, resetRequired]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/ChatEvent' } }
        nextCursor: { type: string }
        resetRequired: { type: boolean, description: 'true: cursor hết hiệu lực, tải lại snapshot' }
    QueueMember:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/StaffRole' } }
    StaffRegistration:
      type: object
      required: [issuer, subject, displayName, roles, queueIds, status, updatedAt]
      properties:
        issuer: { type: string }
        subject: { type: string }
        displayName: { type: [string, 'null'] }
        roles: { type: array, items: { $ref: '#/components/schemas/StaffRole' } }
        queueIds: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        updatedAt: { type: string, format: date-time }
